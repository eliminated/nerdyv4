# Builds the whole solution and runs every test project on pull requests and on pushes to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    # The desktop app is WinUI 3, which only builds on Windows.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Nerdy.slnx

      - name: Build
        run: dotnet build Nerdy.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Nerdy.slnx -c Release --no-build
