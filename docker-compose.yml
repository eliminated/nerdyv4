# Local SQL Server 2022 for parity with Azure SQL. Optional: the API uses a SQLite file by default.
#   cp .env.example .env      (then adjust MSSQL_SA_PASSWORD if you like)
#   docker compose up -d
# and point the API at it (see src/Nerdy.Api/README.md, "SQL Server in Docker").
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: nerdy-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env - copy .env.example}
    ports:
      - "1433:1433"
    volumes:
      - nerdy-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  nerdy-sqlserver-data:
